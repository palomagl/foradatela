<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eff3f6"><meta name="description" content="Fora da Tela — projetos para explorar.">
<title>Fora da Tela — Explore os projetos</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light;--ink:#172439;--muted:#64758c;--glass:rgba(255,255,255,.62);--line:rgba(255,255,255,.72);--shadow:rgba(28,51,82,.12);--bg:#edf4f9;--card:#ffffffbb;--accent:#4389c8}
:root[data-theme=dark]{color-scheme:dark;--ink:#eff5ff;--muted:#a5b4c8;--glass:rgba(13,25,42,.68);--line:rgba(194,220,255,.13);--shadow:rgba(0,0,0,.5);--bg:#07101d;--card:#172237ac;--accent:#89c8ff}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:var(--bg);color:var(--ink);transition:background .3s,color .3s}button,a{font:inherit}button{cursor:pointer}a{color:inherit}.scene{position:fixed;inset:0;overflow:hidden;z-index:-1;background:radial-gradient(ellipse at 52% 24%,#b7d5ee88,transparent 55%)}[data-theme=dark] .scene{background:radial-gradient(ellipse at 50% 28%,#214b7e70,transparent 62%)}.earth{position:absolute;width:min(125vw,720px);aspect-ratio:1;left:50%;top:-410px;translate:-50% 0;border-radius:50%;background:radial-gradient(circle at 26% 27%,#e6f8ff9e,transparent 20%),radial-gradient(circle at 38% 31%,#458a72 0 7%,transparent 9%),radial-gradient(ellipse at 69% 54%,#6ca28a 0 10%,transparent 12%),radial-gradient(ellipse at 44% 75%,#398f6c 0 11%,transparent 14%),radial-gradient(circle at 58% 46%,#458dd0,#12416d 58%,#08152c 78%);box-shadow:0 0 90px 18px #89bfe18a,inset -75px -46px 90px #061527bb;animation:drift 38s ease-in-out infinite alternate;opacity:.92}[data-theme=dark] .earth{opacity:.8;box-shadow:0 0 100px #3774b45c,inset -90px -42px 90px #02050de8}@keyframes drift{from{transform:rotate(-7deg) translateX(-10px)}to{transform:rotate(13deg) translateX(18px)}}.shell{max-width:520px;min-height:100svh;margin:auto;padding:env(safe-area-inset-top) 24px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;margin-top:30px}.brand{font-size:17px;font-weight:650;letter-spacing:-.05em}.brand span{color:var(--accent)}.theme-toggle{display:flex;align-items:center;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(22px);border-radius:999px;padding:8px 13px;color:var(--ink);box-shadow:0 7px 30px var(--shadow)}.intro{padding-top:clamp(110px,19vh,190px);padding-bottom:26px}.intro h1{font-size:clamp(36px,9vw,53px);letter-spacing:-.07em;line-height:1.03;font-weight:600;margin:0 0 10px}.intro p{margin:0;color:var(--muted);font-size:14px}.heading-row{display:flex;justify-content:space-between;align-items:center;margin:20px 0 19px}.heading-row h2{font-size:13px;font-weight:650;letter-spacing:.05em;margin:0}.heading-row span{font-size:12px;color:var(--muted)}.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:23px 10px}.app{background:none;border:0;color:var(--ink);display:flex;align-items:center;flex-direction:column;gap:9px;min-width:0;padding:0}.app:focus-visible,.social:focus-visible,.close:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.icon-tile{width:min(100%,91px);aspect-ratio:1;border-radius:24%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 23px var(--shadow);transition:transform .24s cubic-bezier(.2,1.5,.4,1),box-shadow .24s;overflow:hidden}.app:hover .icon-tile{transform:translateY(-5px) scale(1.035);box-shadow:0 16px 30px var(--shadow)}.icon-tile img{width:100%;height:100%;object-fit:cover}.app-label{font-size:12px;font-weight:500;line-height:1.25;text-align:center;max-width:100%}.placeholder{font-size:40px;color:var(--muted);opacity:.65}.dock{margin-top:auto;display:flex;justify-content:space-around;align-items:center;gap:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(30px) saturate(150%);border-radius:30px;padding:16px;margin-bottom:4px;box-shadow:0 14px 50px var(--shadow)}.social{border:0;background:transparent;color:var(--ink);text-decoration:none;width:42px;height:40px;display:grid;place-items:center;border-radius:16px}.social:hover{background:var(--card)}.social svg{width:23px;height:23px;fill:currentColor}.social.disabled{opacity:.35;pointer-events:none}.sheet{border:0;padding:0;margin:auto auto 0;width:min(100%,520px);max-height:92svh;overflow:auto;border-radius:32px 32px 0 0;color:var(--ink);background:var(--bg);box-shadow:0 0 70px #0006}.sheet::backdrop{background:#030b17a3;backdrop-filter:blur(12px)}.sheet-inner{padding:20px 24px calc(32px + env(safe-area-inset-bottom))}.handle{width:38px;height:5px;border-radius:8px;background:var(--muted);opacity:.4;margin:0 auto 24px}.sheet-top{display:flex;align-items:center;gap:15px}.sheet-top .icon-tile{width:76px;flex:none}.sheet-top h2{font-size:25px;margin:0 0 6px;letter-spacing:-.045em}.sheet-top p{font-size:12px;margin:0;color:var(--muted)}.close{margin-left:auto;align-self:flex-start;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:50%;height:34px;width:34px}.sheet h3{font-size:26px;line-height:1.15;letter-spacing:-.045em;margin:30px 0 10px}.description{font-size:15px;line-height:1.55;color:var(--muted);margin:0 0 22px}.preview{min-height:190px;border:1px solid var(--line);border-radius:22px;background:var(--card);display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted);font-size:13px;overflow:hidden}.preview img{width:100%;height:auto;display:block}.cta{margin-top:20px;background:#226fce;color:white;border-radius:20px;min-height:58px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:650}.cta[aria-disabled=true]{opacity:.45;pointer-events:none}.disclaimer{font-size:12px;color:var(--muted);margin:14px 0 0}.footer-note{text-align:center;font-size:11px;color:var(--muted);margin:24px 0 14px}@media(min-width:800px){.earth{top:-450px}.shell{max-width:540px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("fdt-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script>
</head>
<body><div class="scene" aria-hidden="true"><div class="earth"></div></div>
<main class="shell">
<header class="top"><div class="brand">fora da tela<span>.</span></div><button class="theme-toggle" id="theme" aria-label="Alternar tema" title="Alternar tema">☀ / ☾</button></header>
<section class="intro"><h1>Ideias fora<br>do papel<span style="color:var(--accent)">.</span></h1><p>Uma coleção de coisas que dá para explorar.</p></section>
<section aria-label="Aplicativos"><div class="heading-row"><h2>EXPLORAR</h2><span>09 projetos</span></div><div class="apps" id="apps"></div></section>
<p class="footer-note">Toque em um aplicativo para conhecer.</p>
<nav class="dock" aria-label="Links sociais" id="dock"></nav>
</main>
<dialog class="sheet" id="sheet" aria-labelledby="project-title"><div class="sheet-inner"><div class="handle"></div><div class="sheet-top"><div class="icon-tile" id="project-icon"></div><div><h2 id="project-title"></h2><p id="project-category"></p></div><button class="close" id="close" aria-label="Fechar">×</button></div><h3 id="project-headline"></h3><p class="description" id="project-description"></p><div class="preview" id="project-preview">As capturas reais deste projeto serão adicionadas aqui.</div><a class="cta" id="project-link" target="_blank" rel="noopener noreferrer"></a><p class="disclaimer" id="project-note"></p></div></dialog>
<script src="config.js"></script><script>
const apps=document.querySelector("#apps"),sheet=document.querySelector("#sheet");
function tile(p){const el=document.createElement("div");el.className="icon-tile";if(p.icon){const im=document.createElement("img");im.src=p.icon;im.alt="";im.onerror=()=>{im.remove();el.textContent="✦"};el.append(im)}else{const s=document.createElement("span");s.className="placeholder";s.textContent="✦";el.append(s)}return el}
window.FDT_PROJECTS.forEach((p,i)=>{const b=document.createElement("button");b.type="button";b.className="app";b.setAttribute("aria-label","Conhecer "+p.name);b.append(tile(p));const s=document.createElement("span");s.className="app-label";s.textContent=p.name;b.append(s);b.addEventListener("click",()=>openProject(p));apps.append(b)});
function openProject(p){const icon=document.querySelector("#project-icon");icon.replaceWith(tile(p));document.querySelector(".sheet-top .icon-tile").id="project-icon";document.querySelector("#project-title").textContent=p.name;document.querySelector("#project-category").textContent=p.category;document.querySelector("#project-headline").textContent=p.headline;document.querySelector("#project-description").textContent=p.description;const preview=document.querySelector("#project-preview");preview.replaceChildren();if(p.preview){const img=document.createElement("img");img.src=p.preview;img.alt="Captura real de "+p.name;img.onerror=()=>{preview.textContent="Captura de tela ainda não disponível."};preview.append(img)}else preview.textContent="Capturas reais em breve — sem imagens fictícias.";const a=document.querySelector("#project-link");a.textContent=p.cta+" ↗";a.href=p.url||"#";a.setAttribute("aria-disabled",String(!p.url));document.querySelector("#project-note").textContent=p.note||"";sheet.showModal()}
document.querySelector("#close").addEventListener("click",()=>sheet.close());sheet.addEventListener("click",e=>{if(e.target===sheet)sheet.close()});
document.querySelector("#theme").addEventListener("click",()=>{const theme=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=theme;try{localStorage.setItem("fdt-theme",theme)}catch(e){}});
const icons={github:'<path d="M12 .7a11.3 11.3 0 0 0-3.57 22.03c.57.1.77-.24.77-.54v-2.08c-3.13.68-3.8-1.33-3.8-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 .17 2.18.64 2.72-.48.1-.73.39-1.23.72-1.51-2.5-.28-5.12-1.25-5.12-5.57 0-1.23.44-2.24 1.16-3.03-.12-.28-.5-1.44.11-2.99 0 0 .95-.3 3.11 1.16a10.8 10.8 0 0 1 5.66 0c2.16-1.46 3.1-1.16 3.1-1.16.62 1.55.24 2.71.12 3 .72.78 1.15 1.8 1.15 3.02 0 4.33-2.62 5.29-5.12 5.56.4.35.77 1.01.77 2.04v3.02c0 .3.2.65.78.54A11.3 11.3 0 0 0 12 .7z"/>',linkedin:'<path d="M20.45 2H3.55C2.7 2 2 2.7 2 3.55v16.9c0 .85.7 1.55 1.55 1.55h16.9c.85 0 1.55-.7 1.55-1.55V3.55c0-.85-.7-1.55-1.55-1.55zM7.93 18.75H4.95V9.17h2.98v9.58zM6.44 7.86a1.73 1.73 0 1 1 0-3.46 1.73 1.73 0 0 1 0 3.46zm12.31 10.89h-2.98V14.1c0-1.1-.02-2.52-1.53-2.52-1.53 0-1.77 1.2-1.77 2.44v4.73H9.5V9.17h2.85v1.31h.04c.4-.75 1.37-1.54 2.82-1.54 3.01 0 3.57 1.98 3.57 4.56v5.25z"/>',mail:'<path d="M2 5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5zm2 .5V6l8 6 8-6v-.5H4zm16 3-7.4 5.55a1 1 0 0 1-1.2 0L4 8.5V19h16V8.5z"/>'};
document.querySelector("#dock").innerHTML=Object.entries(window.FDT_SOCIAL).map(([key,url])=>'<a class="social '+(!url?'disabled':'')+'" href="'+(url||'#')+'" aria-label="'+key+'" '+(url?'target="_blank" rel="noopener noreferrer"':'aria-disabled="true"')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+icons[key]+'</svg></a>').join("");
</script></body></html>
